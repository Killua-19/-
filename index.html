<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>no olvides lo importante que eres✨</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    background-color: #000;
    font-family: 'Arial Black', Arial, sans-serif;
  }

  #center-text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(1.1rem, 4.5vw, 2.2rem);
    font-weight: 900;
    color: #fff;
    text-shadow:
      0 0 10px #fff,
      0 0 20px #fff,
      0 0 40px #fff,
      0 0 60px #fff,
      0 0 80px #fff,
      0 0 100px #fff;
    animation: pulse 2s ease-in-out infinite;
    user-select: none;
    white-space: nowrap;
    z-index: 10;
    text-align: center;
    max-width: 95vw;
    padding: 0 10px;
    box-sizing: border-box;
  }

  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.08); }
  }

  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 5;
  }
</style>
</head>
<body>

<div id="center-text">✨ no olvides lo importante que eres ✨</div>
<canvas id="matrix"></canvas>

<script>
  const canvas = document.getElementById("matrix");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const emojis = ["🪼", "✨", "🌟", "💫", "🪼", "⭐", "🌊"];
  const fontSize = 22;
  let columns = Math.floor(canvas.width / (fontSize * 3.2));
  let drops = Array(columns).fill(1);

  const explosiones = [];

  function draw() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.12)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = fontSize + "px Arial Black";
    ctx.shadowColor = "#fff";
    ctx.shadowBlur = 10;

    for (let i = 0; i < drops.length; i++) {
      const text = emojis[Math.floor(Math.random() * emojis.length)];

      ctx.fillStyle = "rgba(255,255,255,1)";
      ctx.fillText(text, i * fontSize * 3.2, drops[i] * fontSize);

      for (let j = 1; j < 8; j++) {
        ctx.fillStyle = `rgba(255,255,255,${1 - j * 0.12})`;
        ctx.fillText(text, i * fontSize * 3.2, (drops[i] - j) * fontSize);
      }

      drops[i]++;

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
    }

    for (let idx = explosiones.length - 1; idx >= 0; idx--) {
      const exp = explosiones[idx];
      ctx.font = "20px Arial Black";
      ctx.shadowColor = "#fff";
      ctx.shadowBlur = 14;
      ctx.fillStyle = `rgba(255,255,255,${exp.life / 50})`;
      ctx.fillText(exp.emoji, exp.x, exp.y);

      exp.x += exp.dx;
      exp.y += exp.dy;
      exp.life--;

      if (exp.life <= 0) explosiones.splice(idx, 1);
    }

    requestAnimationFrame(draw);
  }

  function explosion(x, y) {
    for (let i = 0; i < 14; i++) {
      const angle = Math.random() * 2 * Math.PI;
      const velocity = 2.5 + Math.random() * 5.5;
      explosiones.push({
        x: x,
        y: y,
        dx: Math.cos(angle) * velocity,
        dy: Math.sin(angle) * velocity,
        life: 50,
        emoji: emojis[Math.floor(Math.random() * emojis.length)]
      });
    }
  }

  document.addEventListener("click", e => {
    explosion(e.clientX, e.clientY);
  });

  document.addEventListener("touchstart", e => {
    const touch = e.touches[0];
    explosion(touch.clientX, touch.clientY);
  });

  window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / (fontSize * 3.2));
    drops = Array(columns).fill(1);
  });

  requestAnimationFrame(draw);
</script>

</body>
</html>
