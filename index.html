<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>No olvides lo importante que eres✨</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  height: 100%;
  background: #000000;
  font-family: 'Arial Black', Arial, sans-serif;
}

#center-text {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  font-size: clamp(1.5rem, 5vw, 2.8rem);
  font-weight: 900;

  color: white;

  text-shadow:
    0 0 8px white,
    0 0 16px white,
    0 0 32px white,
    0 0 48px white,
    0 0 70px white;

  animation: pulse 2s infinite ease-in-out;

  z-index: 10;
  text-align: center;
  line-height: 1.25;
  width: 90vw;
}


@keyframes pulse {

0%,100%{
 transform:translate(-50%,-50%) scale(1);
}

50%{
 transform:translate(-50%,-50%) scale(1.05);
}

}


canvas {

display:block;
position:fixed;
top:0;
left:0;
z-index:5;
background:#000;

}

</style>
</head>


<body>


<div id="center-text">
✨No olvides lo<br>
importante que eres✨
</div>


<canvas id="matrix"></canvas>



<script>

const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");


canvas.width=innerWidth;
canvas.height=innerHeight;



const jelly="🪼🪼🪼🪼";

const fontSize=24;


// cantidad de lluvias
let columns=Math.floor(canvas.width/(fontSize*5));


let drops=[];


function createDrops(){

drops=[];

for(let i=0;i<columns;i++){

drops.push({

x:i*fontSize*5,

y:Math.random()*-canvas.height,

speed:0.5+Math.random()*0.6

});

}

}


createDrops();



const explosiones=[];



function draw(){


ctx.fillStyle="rgba(0,0,0,0.25)";
ctx.fillRect(0,0,canvas.width,canvas.height);



ctx.font=fontSize+"px Arial";
ctx.shadowColor="#ffffff";
ctx.shadowBlur=15;



drops.forEach(drop=>{


// cabeza brillante

ctx.fillStyle="#ffffff";

ctx.fillText(
jelly,
drop.x,
drop.y
);



// estela

for(let i=1;i<7;i++){

ctx.fillStyle=
`rgba(255,255,255,${1-i*0.14})`;

ctx.fillText(
jelly,
drop.x,
drop.y-(i*fontSize)
);

}



drop.y+=drop.speed;



if(drop.y>canvas.height+100){

drop.y=Math.random()*-300;

}

});




// explosiones al tocar


for(let i=explosiones.length-1;i>=0;i--){


let e=explosiones[i];


ctx.font="22px Arial";

ctx.fillStyle=
`rgba(255,255,255,${e.life/50})`;

ctx.shadowBlur=18;


ctx.fillText(
"🪼",
e.x,
e.y
);



e.x+=e.dx;
e.y+=e.dy;

e.life--;



if(e.life<=0){

explosiones.splice(i,1);

}


}



requestAnimationFrame(draw);


}





function explosion(x,y){


for(let i=0;i<16;i++){


let angle=Math.random()*Math.PI*2;

let velocity=2+Math.random()*5;


explosiones.push({

x:x,
y:y,

dx:Math.cos(angle)*velocity,
dy:Math.sin(angle)*velocity,

life:50

});


}


}



document.addEventListener("click",e=>{

explosion(e.clientX,e.clientY);

});



document.addEventListener("touchstart",e=>{

let t=e.touches[0];

explosion(t.clientX,t.clientY);

});



window.addEventListener("resize",()=>{

canvas.width=innerWidth;
canvas.height=innerHeight;

columns=Math.floor(canvas.width/(fontSize*5));

createDrops();

});



requestAnimationFrame(draw);


</script>


</body>
</html>
