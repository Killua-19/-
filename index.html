<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>No olvides lo importante que eres✨</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000000;
    font-family:"Arial Black",Arial,sans-serif;
}


body{
    background:#000000;
}


canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#000000;
    z-index:1;
}


#center-text{

    position:fixed;
    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    color:white;

    font-size:clamp(1.8rem,6vw,3.2rem);

    font-weight:900;

    text-align:center;

    line-height:1.25;

    z-index:5;

    text-shadow:
    0 0 8px white,
    0 0 18px white,
    0 0 35px white,
    0 0 60px white;

    animation:pulse 2s infinite ease-in-out;

    width:90vw;

}


@keyframes pulse{

0%,100%{
    transform:translate(-50%,-50%) scale(1);
}

50%{
    transform:translate(-50%,-50%) scale(1.05);
}

}


</style>

</head>

<body>


<div id="center-text">

✨No olvides lo<br>
importante que eres✨

</div>


<canvas id="matrix"></canvas>



<script>


const canvas=document.getElementById("matrix");

const ctx=canvas.getContext("2d");


canvas.width=innerWidth;
canvas.height=innerHeight;



const emoji="🪼";

const tamaño=28;



let columnas;

let gotas=[];



function iniciar(){


columnas=Math.floor(canvas.width/(tamaño*1.4));


gotas=[];



for(let i=0;i<columnas;i++){


let cantidad=3+Math.floor(Math.random()*5);


for(let j=0;j<cantidad;j++){


gotas.push({

x:i*tamaño*1.4,

y:
Math.random()*canvas.height -
(j*200),

velocidad:
1+Math.random()*1.5,

movimiento:
(Math.random()-0.5)*0.8,

oscilacion:
Math.random()*Math.PI*2

});


}


}


}



iniciar();



function lluvia(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


// fondo negro real

ctx.fillStyle="#000000";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);



ctx.font=tamaño+"px Arial";



for(let i=0;i<gotas.length;i++){


let g=gotas[i];


// movimiento lateral tipo corriente

g.oscilacion+=0.03;


g.x+=Math.sin(g.oscilacion)*0.5;

g.x+=g.movimiento;



// dibujar emoji original

ctx.fillStyle="white";

ctx.fillText(
emoji,
g.x,
g.y
);



g.y+=g.velocidad;



// cuando desaparece vuelve arriba

if(g.y>canvas.height+50){

g.y= -Math.random()*300;

g.x=Math.random()*canvas.width;

}


}



requestAnimationFrame(lluvia);


}



lluvia();



window.addEventListener("resize",()=>{

canvas.width=innerWidth;

canvas.height=innerHeight;

iniciar();

});



</script>


</body>
</html>
