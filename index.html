<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>no olvides lo importante que eres✨</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    background-color: #000000;
    font-family: 'Arial Black', Arial, sans-serif;
  }

  #center-text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(1.6rem, 6vw, 3rem);
    font-weight: 900;
    color: #ffffff;
    text-shadow:
      0 0 8px #fff,
      0 0 16px #fff,
      0 0 32px #fff,
      0 0 48px #fff,
      0 0 64px #fff,
      0 0 80px #fff;
    animation: pulse 2s ease-in-out infinite;
    user-select: none;
    z-index: 10;
    text-align: center;
    max-width: 92vw;
    line-height: 1.25;
    padding: 0 12px;
    box-sizing: border-box;
  }

  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.07); }
  }

  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 5;
    background-color: #000000;
  }
</style>
</head>
<body>

<div id="center-text">✨ no olvides lo<br>importante que eres ✨</div>
<canvas id="matrix"></canvas>

<script>
  const canvas = document.getElementById("matrix");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const emoji = "🪼";
  const fontSize = 24;
  let columns = Math.floor(canvas.width / (fontSize * 2.8));
  let drops = Array.from({ length: columns }, () => Math.random() * -20);

  const explosiones = [];

  function draw() {
    // Fondo negro puro
    ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = fontSize + "px Arial Black";
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 12;

    for (let i = 0; i < drops.length; i++) {
      // Cabeza brillante
      ctx.fillStyle = "#ffffff";
      ctx.fillText(emoji, i * fontSize * 2.8, drops[i] * fontSize);

      // Estela
      for (let j = 1; j < 7; j++) {
        ctx.fillStyle = `rgba(255, 255, 255, ${1 - j * 0.14})`;
        ctx.fillText(emoji, i * fontSize * 2.8, (drops[i] - j) * fontSize);
      }

      drops[i]++;

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = Math.random() * -15;
      }
    }

    // Explosiones al tocar
    for (let idx = explosiones.length - 1; idx >= 0; idx--) {
      const exp = explosiones[idx];
      ctx.font = "22px Arial Black";
      ctx.shadowBlur = 16;
      ctx.fillStyle = `rgba(255, 255, 255, ${exp.life / 50})`;
      ctx.fillText(emoji, exp.x, exp.y);

      exp.x += exp.dx;
      exp.y += exp.dy;
      exp.life--;

      if (exp.life <= 0) explosiones.splice(idx, 1);
    }

    requestAnimationFrame(draw);
  }

  function explosion(x, y) {
    for (let i = 0; i < 16; i++) {
      const angle = Math.random() * Math.PI * 2;
      const velocity = 2 + Math.random() * 6;
      explosiones.push({
        x: x,
        y: y,
        dx: Math.cos(angle) * velocity,
        dy: Math.sin(angle) * velocity,
        life: 55
      });
    }
  }

  document.addEventListener("click", e => explosion(e.clientX, e.clientY));
  document.addEventListener("touchstart", e => {
    const t = e.touches[0];
    explosion(t.clientX, t.clientY);
  });

  window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / (fontSize * 2.8));
    drops = Array.from({ length: columns }, () => Math.random() * -20);
  });

  requestAnimationFrame(draw);
</script>

</body>
</html>
