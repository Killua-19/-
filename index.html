<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>No olvides lo importante que eres✨</title>

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000000;
    font-family:'Arial Black', Arial, sans-serif;
}


canvas {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#000000;
    z-index:1;
}


#center-text {

    position:fixed;
    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    color:#ffffff;

    font-size:clamp(1.5rem,5vw,2.8rem);

    font-weight:900;

    text-align:center;

    line-height:1.25;

    z-index:5;

    text-shadow:
    0 0 5px #fff,
    0 0 15px #fff,
    0 0 30px #fff,
    0 0 50px #fff;

    animation:pulse 2s infinite ease-in-out;

}


@keyframes pulse {

0%,100%{
transform:translate(-50%,-50%) scale(1);
}

50%{
transform:translate(-50%,-50%) scale(1.06);
}

}


</style>

</head>


<body>


<div id="center-text">

✨No olvides lo<br>
importante que eres✨

</div>


<canvas id="matrix"></canvas>



<script>


const canvas=document.getElementById("matrix");

const ctx=canvas.getContext("2d");



canvas.width=window.innerWidth;

canvas.height=window.innerHeight;



const emoji="🪼🪼🪼";

const size=24;



let columnas=Math.floor(canvas.width/(size*2.8));



let gotas=[];



function crearLluvia(){


gotas=[];


for(let i=0;i<columnas;i++){


gotas.push({

x:i*size*2.8,

y:Math.random()*-canvas.height,

velocidad:0.8+Math.random()*0.7

});


}


}



crearLluvia();



function dibujar(){



// negro puro sin aclarar

ctx.fillStyle="#000000";

ctx.fillRect(0,0,canvas.width,canvas.height);



ctx.font=size+"px Arial Black";

ctx.shadowColor="#ffffff";

ctx.shadowBlur=15;



gotas.forEach(gota=>{


// cabeza brillante

ctx.fillStyle="#ffffff";

ctx.fillText(
emoji,
gota.x,
gota.y
);



// estela tipo matrix

for(let i=1;i<=8;i++){


ctx.fillStyle=
`rgba(255,255,255,${1-i*0.11})`;


ctx.fillText(
emoji,
gota.x,
gota.y-(i*size)
);


}



// movimiento

gota.y+=gota.velocidad;



// reinicio

if(gota.y>canvas.height+100){

gota.y=Math.random()*-400;

}

});



requestAnimationFrame(dibujar);


}



dibujar();



// explosiones al tocar


let explosiones=[];



function explotar(x,y){


for(let i=0;i<25;i++){


let angulo=Math.random()*Math.PI*2;

let fuerza=2+Math.random()*5;


explosiones.push({

x:x,

y:y,

dx:Math.cos(angulo)*fuerza,

dy:Math.sin(angulo)*fuerza,

vida:50

});


}


}



function dibujarExplosiones(){


for(let i=explosiones.length-1;i>=0;i--){


let e=explosiones[i];


ctx.font="22px Arial Black";

ctx.fillStyle=
`rgba(255,255,255,${e.vida/50})`;

ctx.shadowBlur=20;


ctx.fillText(
"🪼",
e.x,
e.y
);



e.x+=e.dx;

e.y+=e.dy;


e.vida--;


if(e.vida<=0){

explosiones.splice(i,1);

}


}


}



function animacion(){


dibujarExplosiones();

requestAnimationFrame(animacion);


}


animacion();



document.addEventListener("click",function(e){

explotar(e.clientX,e.clientY);

});



document.addEventListener("touchstart",function(e){

let t=e.touches[0];

explotar(t.clientX,t.clientY);

});



window.addEventListener("resize",()=>{


canvas.width=window.innerWidth;

canvas.height=window.innerHeight;


columnas=Math.floor(canvas.width/(size*2.8));


crearLluvia();


});



</script>


</body>
</html>
